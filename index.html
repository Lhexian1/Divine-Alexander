    <script>
      (function () {
        var origDefineProperty = Object.defineProperty;
        var extensionProps = {
          isZerion: true,
          ethereum: true,
          isMetaMask: true,
          isRabby: true,
          isBraveWallet: true,
          isPhantom: true,
          isCoinbaseWallet: true,
          zerionWallet: true,
          solana: true
        };
        Object.defineProperty = function (target, prop, descriptor) {
          try {
            if (descriptor && typeof descriptor === 'object' && extensionProps[String(prop)]) {
              var safeDescriptor = Object.assign({}, descriptor, { configurable: true });
              return origDefineProperty.call(Object, target, prop, safeDescriptor);
            }
            return origDefineProperty.call(Object, target, prop, descriptor);
          } catch (err) {
            if (
              err instanceof TypeError &&
              /Cannot redefine property/i.test(String(err.message || ''))
            ) {
              return target;
            }
            throw err;
          }
        };

        window.addEventListener(
          'error',
          function (event) {
            var file = String((event && event.filename) || '');
            var msg = String((event && event.message) || '');
            if (
              file.indexOf('chrome-extension://') === 0 ||
              file.indexOf('moz-extension://') === 0 ||
              msg.indexOf('isZerion') !== -1 ||
              msg.indexOf('Cannot redefine property') !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return false;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = String((event && event.reason && (event.reason.stack || event.reason.message || event.reason)) || '');
            if (
              reason.indexOf('chrome-extension://') !== -1 ||
              reason.indexOf('moz-extension://') !== -1 ||
              reason.indexOf('isZerion') !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return false;
            }
          },
          true
        );
      })();
    </script>
